name: React CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build docker image
        run: docker build -t ghcr.io/kandji-max/devops-react:${{ github.sha }} .

      - name: Push docker image
        run: docker push ghcr.io/kandji-max/devops-react:${{ github.sha }}

      - name: Debug SSH key
        run: |
          echo "=== KEY START ==="
          printf '%s\n' "${{ secrets.HOSTINGER_SSH_KEY }}"
          echo "=== KEY END ==="

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/hostinger_key
          chmod 600 ~/.ssh/hostinger_key
          ssh-keyscan -p "${{ secrets.HOSTINGER_PORT }}" "${{ secrets.HOSTINGER_HOST }}" >> ~/.ssh/known_hosts

      - name: Clean Hostinger public_html
        run: |
          ssh \
            -i ~/.ssh/hostinger_key \
            -p "${{ secrets.HOSTINGER_PORT }}" \
            "${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}" \
            'find ~/domains/olivedrab-snail-926046.hostingersite.com/public_html -mindepth 1 -maxdepth 1 -exec rm -rf {} +'

      - name: Deploy React to Hostinger
        run: |
          scp \
            -i ~/.ssh/hostinger_key \
            -P "${{ secrets.HOSTINGER_PORT }}" \
            -r build/. \
            "${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}:~/domains/olivedrab-snail-926046.hostingersite.com/public_html/"
