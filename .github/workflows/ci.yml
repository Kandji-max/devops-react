name: React CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: run test
        run: npm test
      
      - name: Build application
        run: npm run build
      
      - name: login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build docker image
        run: docker build -t ghcr.io/kandji-max/devops-react:${{ github.sha }} .

      - name: Push docker image
        run: docker push ghcr.io/kandji-max/devops-react:${{ github.sha }}

      - name: Configure ssh
        run: |
          mkdir -p ~/.ssh 
          printf '%s\n' '${{ secrets.HOSTINGER_SSH_KEY }}' > ~/.ssh/hostinger_key
          chmod 600 ~/.ssh/hostinger_key
          ssh-keyscan  -p "${{ secrets.HOSTINGER_PORT }}" "${{ secrets.HOSTINGER_HOST }}" >> ~/.ssh/known_hosts

      - name: clean page hostinger
        run: |
          ssh \
          -i '~/.ssh/hostinger_key' \
          -p "${{ secrets.HOSTINGER_PORT }}" \
          "${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}" \
          'find ~/domains/olivedrab-snail-926046.hostingersite.com\public_html -mindepth 1 -maxdepth 1 -exec rm -rf {} +' 

      - name: deploy react to hostinger
        run: |
          scp \
            -i ~/.ssh/hostinger_key \
            -P "${{ secrets.HOSTINGER_PORT }}" \
            -r build/. \
            "${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}: ~/domains/olivedrab-snail-926046.hostingersite.com\public_html/"
          